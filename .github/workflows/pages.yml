name: pages

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
    inputs:
      full_redeploy:
        description: 'Deploy lại toàn bộ Pages (ngoài ra chỉ cập nhật data)'
        required: false
        default: 'true'
        type: string

permissions:
  contents: write
  pages: write
  id-token: write
  actions: read

concurrency:
  group: pages-dashboard
  cancel-in-progress: true

jobs:
  collect:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Thu thập dữ liệu bot fleet (Python)
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || github.token }}
        run: |
          python3 collect.py

      - name: Commit dữ liệu
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "data: cập nhật trạng thái bot fleet $(date -u +'%H:%M UTC')"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: collect
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          # phải lấy commit MỚI NHẤT: job collect vừa push data/ lên main
          ref: main

      - uses: actions/configure-pages@v5
        id: pages

      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - id: deployment
        uses: actions/deploy-pages@v4
